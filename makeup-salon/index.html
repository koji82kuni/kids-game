<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きらきら メイクやさん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* ならび：タイトル → おみせ／おえかき（ステージ＋どうぐ）→ できた！ → アルバム */
:root{
  --bg:#fff5f9; --surface:#ffffff; --ink:#334155; --muted:#64748b; --line:#f3d3e2;
  --rose:#be185d;      /* 文字にも使える濃いピンク */
  --rose-soft:#fde2ef;
  --mint:#047857; --mint-soft:#d1fae5;
  --sun:#b45309; --sun-soft:#fef3c7;
  --violet:#6d28d9; --violet-soft:#ede9fe;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic Pro","BIZ UDPGothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;font-weight:800;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.screen.on{display:flex}
.scroll{overflow-y:auto}

/* タイトル */
#title{align-items:center;justify-content:center;gap:18px;text-align:center;
  background:radial-gradient(circle at 20% 10%,#ffe4f1 0,transparent 40%),radial-gradient(circle at 80% 90%,#e9e4ff 0,transparent 45%),var(--bg)}
.logo{font-size:clamp(30px,7vw,54px);font-weight:800;color:var(--rose);line-height:1.2;margin:0;
  text-shadow:0 3px 0 #fff,0 6px 0 #fbcfe8}
.logo small{display:block;font-size:.42em;color:var(--violet);text-shadow:none;margin-top:6px}
.title-art{width:min(60vw,240px);height:auto}
.menu{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.big{border:none;border-radius:22px;padding:16px 26px;font-size:clamp(20px,4.6vw,28px);color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;min-width:200px;justify-content:center}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.b-shop{background:#be185d}.b-draw{background:#6d28d9}.b-album{background:#047857}
.age{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px}
.age button{border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px}
.age button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.score{font-size:15px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);font-weight:500}

/* あそぶ画面 */
#play{gap:8px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon{border:none;background:#fff;border-radius:14px;min-width:48px;height:48px;font-size:24px;box-shadow:0 3px 0 var(--line)}
.done{margin-left:auto;border:none;border-radius:16px;background:#c2410c;color:#fff;font-size:22px;padding:8px 20px;height:52px;
  box-shadow:0 5px 0 #7c2d12;animation:pulse 2.4s ease-in-out infinite}
.done:active{transform:translateY(3px);box-shadow:0 2px 0 #7c2d12}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.wish{flex:1 1 260px;min-width:0;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 10px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.wish .who{color:var(--rose);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;
  background:#fff;font-size:15px}
.chip i{width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;flex:none;display:inline-block}
.chip canvas{width:26px;height:26px;flex:none}
.chip.ok{background:var(--mint-soft);border-color:#6ee7b7}
.chip.ok::after{content:"✔";color:var(--mint);margin-left:2px}
.say{border:none;background:var(--violet);color:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
@media (max-width:640px){
  .wish{order:3;flex-basis:100%;gap:5px;padding:5px 8px}
  .chip{font-size:13px;padding:2px 8px 2px 3px}.chip i{width:20px;height:20px}.chip canvas{width:22px;height:22px}
  .wish .who{font-size:13px;flex-basis:100%}
  .done{height:46px;font-size:20px}
  .tool{font-size:12px}.tool b{font-size:22px}
}

.body{flex:1;min-height:0;display:grid;grid-template-rows:1fr auto;gap:8px}
@media (orientation:landscape) and (min-width:700px){ .body{grid-template-columns:1fr minmax(300px,38%);grid-template-rows:1fr} }
.stagewrap{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;border-radius:24px;overflow:hidden;background:
  radial-gradient(circle at 50% 35%,#fff 0,#fff 45%,#ffeaf4 100%);box-shadow:0 0 0 4px #fff,0 8px 24px rgba(190,24,93,.15);touch-action:none}
#art,#paint{position:absolute;inset:0;width:100%;height:100%}
#art svg{width:100%;height:100%;display:block}
#stage.arrive{animation:arrive .8s cubic-bezier(.3,1.5,.6,1)}
@keyframes arrive{from{transform:translateY(14%) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
#stage.happy #art{animation:hop .5s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-6%)}}

.panel{background:#fff;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 3px 0 var(--line);overflow-y:auto}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool b{font-size:26px;line-height:1}
.tool[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.color{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e2e8f0;padding:0;min-width:0}
.color[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.rainbow{background:conic-gradient(#ef4444,#fb923c,#facc15,#22c55e,#38bdf8,#a855f7,#ef4444)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.size{border:3px solid var(--line);background:#fff;border-radius:12px;width:48px;height:44px;display:grid;place-items:center;padding:0}
.size span{display:block;border-radius:50%;background:var(--ink)}
.size[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}
.stk{border:3px solid var(--line);background:#fff;border-radius:12px;width:52px;height:52px;padding:2px}
.stk canvas{width:100%;height:100%}
.stk[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}
.small{border:none;border-radius:12px;padding:8px 12px;font-size:15px;background:#f1f5f9}
.small.warn{background:#ffe4e6;color:#9f1239}
.hint{animation:blink .45s ease-in-out 4}
@keyframes blink{50%{opacity:.25}}
.label{font-size:13px;color:var(--muted)}

/* まど（できた・アルバム・ヘルプ） */
.ov{position:fixed;inset:0;background:rgba(51,65,85,.55);display:none;align-items:center;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.ov.on{display:flex}
.card{background:#fff;border-radius:26px;padding:16px;max-width:620px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.card h2{margin:0;color:var(--rose);font-size:clamp(22px,5vw,30px)}
.card img.result{width:min(76vw,360px);max-height:46vh;object-fit:contain;border-radius:18px;box-shadow:0 0 0 4px #fde2ef}
.stars{font-size:38px;letter-spacing:4px}
.stars span{display:inline-block;animation:pop .5s cubic-bezier(.3,1.8,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.saved{background:var(--mint-soft);color:var(--mint);border-radius:999px;padding:4px 14px;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:none;border-radius:16px;padding:12px 18px;font-size:18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.rose{background:#be185d}.btn.mint{background:#047857}.btn.violet{background:#6d28d9}.btn.gray{background:#475569}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}

/* おえかき：えらぶ */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%}
.pick button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick svg{width:100%;height:auto;aspect-ratio:1}
.pick .blank{aspect-ratio:1;width:100%;border-radius:12px;background:#fff;border:3px dashed #f9a8d4;display:grid;place-items:center;font-size:34px}

/* アルバム */
#album .head{display:flex;align-items:center;gap:10px}
#album h2{margin:0;color:var(--mint);font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding-block:10px}
.grid button{border:none;padding:0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--line);position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.grid .tagg{position:absolute;left:6px;top:6px;background:#6d28d9;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:18px}
.toggle{display:flex;gap:6px}
.toggle button{border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px}
.toggle button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.parent{width:100%;text-align:left;background:#f8fafc;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:14px}
.parent h3{margin:0;font-size:16px;color:var(--ink)}
.parent ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.parent textarea{width:100%;min-height:88px;font:inherit;font-size:13px;border:2px solid #e2e8f0;border-radius:10px;padding:8px;user-select:text;-webkit-user-select:text}
.parent a{color:#6d28d9}
.parent .row button,.parent .row label{border:none;border-radius:12px;padding:8px 12px;font-size:14px;background:#6d28d9;color:#fff;font-weight:800;cursor:pointer}
.parent .row label input{display:none}
.msg{font-size:13px;color:var(--mint);min-height:1em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- タイトル -->
<section class="screen on" id="title">
  <svg class="title-art" viewBox="0 0 240 150" aria-hidden="true">
    <rect x="18" y="58" width="204" height="84" rx="16" fill="#fff" stroke="#f9a8d4" stroke-width="5"/>
    <path d="M12 62 L40 22 H200 L228 62 Z" fill="#f472b6"/>
    <path d="M12 62 Q31 82 50 62 Q69 82 88 62 Q107 82 126 62 Q145 82 164 62 Q183 82 202 62 Q215 76 228 62" fill="#fbcfe8"/>
    <rect x="44" y="84" width="48" height="58" rx="8" fill="#fde2ef" stroke="#f472b6" stroke-width="4"/>
    <circle cx="82" cy="114" r="4" fill="#be185d"/>
    <rect x="112" y="84" width="88" height="40" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="4"/>
    <path d="M150 96 l6 12 l12 2 l-9 8 l2 12 l-11 -6 l-11 6 l2 -12 l-9 -8 l12 -2z" fill="#facc15" transform="translate(6 -6) scale(.8)"/>
    <text x="120" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" font-family="sans-serif">MAKE UP</text>
  </svg>
  <h1 class="logo">きらきら メイクやさん<small>なんでも かわいく メイクするよ</small></h1>
  <div class="menu">
    <button class="big b-shop" id="go-shop"><span aria-hidden="true">🏪</span>おみせ</button>
    <button class="big b-draw" id="go-draw"><span aria-hidden="true">🎨</span>おえかき</button>
    <button class="big b-album" id="go-album"><span aria-hidden="true">📒</span>アルバム</button>
  </div>
  <div class="age" role="group" aria-label="おねがいの かず">
    <button data-age="small" aria-pressed="true">4〜5さい（おねがい 1つ）</button>
    <button data-age="big" aria-pressed="false">6〜8さい（おねがい 2〜3つ）</button>
  </div>
  <p class="score" id="score"></p>
  <p class="foot">できた えは この きかいの アルバムに のこります</p>
</section>

<!-- おえかき：なにに かく？ -->
<section class="screen scroll" id="drawpick">
  <div class="top"><button class="icon" data-home aria-label="はじめに もどる">🏠</button><h2 style="margin:0;color:var(--violet)">なにに かく？</h2></div>
  <div class="pick" id="picklist"></div>
</section>

<!-- あそぶ -->
<section class="screen" id="play">
  <div class="top">
    <button class="icon" data-home aria-label="はじめに もどる">🏠</button>
    <div class="wish" id="wish"></div>
    <button class="done" id="done">できた！</button>
  </div>
  <div class="body">
    <div class="stagewrap" id="stagewrap">
      <div id="stage"><div id="art"></div><canvas id="paint" width="800" height="800"></canvas></div>
    </div>
    <div class="panel">
      <div class="tools" role="group" aria-label="どうぐ">
        <button class="tool" data-tool="fill" aria-pressed="true"><b aria-hidden="true">🪣</b>ぬる</button>
        <button class="tool" data-tool="pen" aria-pressed="false"><b aria-hidden="true">🖍️</b>かく</button>
        <button class="tool" data-tool="sticker" aria-pressed="false"><b aria-hidden="true">⭐</b>シール</button>
        <button class="tool" data-tool="eraser" aria-pressed="false"><b aria-hidden="true">🧽</b>けす</button>
      </div>
      <div class="colors" id="colors" role="group" aria-label="いろ"></div>
      <div class="row" id="sizes" role="group" aria-label="ふとさ">
        <span class="label">ふとさ</span>
        <button class="size" data-size="0" aria-pressed="false" aria-label="ほそい"><span style="width:8px;height:8px"></span></button>
        <button class="size" data-size="1" aria-pressed="true" aria-label="ふつう"><span style="width:16px;height:16px"></span></button>
        <button class="size" data-size="2" aria-pressed="false" aria-label="ふとい"><span style="width:26px;height:26px"></span></button>
      </div>
      <div class="row" id="stickers" role="group" aria-label="シール" hidden></div>
      <div class="row">
        <button class="small" id="undo">↩ もどす</button>
        <button class="small warn" id="clear">ぜんぶ けす</button>
        <button class="small" id="mute" aria-pressed="false">🔊 おと</button>
      </div>
    </div>
  </div>
</section>

<!-- アルバム -->
<section class="screen scroll" id="album">
  <div class="head"><button class="icon" data-home aria-label="はじめに もどる">🏠</button><h2>アルバム</h2><span class="label" id="acount"></span></div>
  <div class="grid" id="grid"></div>
</section>

<!-- できた！ -->
<div class="ov" id="resultov" role="dialog" aria-modal="true" aria-labelledby="rtitle">
  <div class="card">
    <h2 id="rtitle">できた！</h2>
    <div class="stars" id="rstars"></div>
    <img class="result" id="rimg" alt="できた え">
    <p id="rtext" style="margin:0;font-size:18px"></p>
    <span class="saved" id="rsaved">📒 アルバムに いれたよ</span>
    <div class="btns">
      <button class="btn rose" id="rnext">つぎの おきゃくさん</button>
      <button class="btn violet" id="ragain">もういちど かく</button>
      <button class="btn mint" id="ralbum">アルバムを みる</button>
    </div>
  </div>
</div>

<!-- アルバムの 1まい -->
<div class="ov" id="viewov" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="card">
    <h2 id="vtitle" style="color:var(--mint)"></h2>
    <div class="toggle" id="vtoggle" hidden>
      <button data-v="orig" aria-pressed="true">もとの え</button>
      <button data-v="gem" aria-pressed="false">へんしん！</button>
    </div>
    <img class="result" id="vimg" alt="アルバムの え">
    <div class="btns">
      <button class="btn mint" id="vsave">⬇ ほぞん</button>
      <button class="btn gray" id="vdel">けす</button>
      <button class="btn rose" id="vclose">とじる</button>
    </div>
    <div class="parent">
      <h3>おうちの方へ：Geminiで へんしん</h3>
      <ol>
        <li><div class="row"><button id="g1">① えを ダウンロード</button></div></li>
        <li>おねがいの文をコピーします（うまくいかないときは、下の文を長押しでコピー）
          <div class="row"><button id="g2">② 文を コピー</button></div>
          <textarea id="gprompt" readonly></textarea></li>
        <li><a href="https://gemini.google.com/app" target="_blank" rel="noopener">③ Geminiを ひらく</a>（えを添付し、文を貼りつけて送ります）</li>
        <li>できた絵をダウンロードして、ここに入れます
          <div class="row"><label>④ へんしんした えを いれる<input type="file" id="gfile" accept="image/*"></label></div></li>
      </ol>
      <p class="msg" id="gmsg" aria-live="polite"></p>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
(function(){
'use strict';
// ───────── いろ ─────────
const PALETTE=[
  {k:'red',n:'あか',c:'#ef4444'},{k:'pink',n:'ピンク',c:'#f472b6'},{k:'orange',n:'オレンジ',c:'#fb923c'},
  {k:'yellow',n:'きいろ',c:'#facc15'},{k:'lime',n:'きみどり',c:'#a3e635'},{k:'green',n:'みどり',c:'#22c55e'},
  {k:'sky',n:'みずいろ',c:'#7dd3fc'},{k:'blue',n:'あお',c:'#3b82f6'},{k:'purple',n:'むらさき',c:'#a855f7'},
  {k:'brown',n:'ちゃいろ',c:'#a16207'},{k:'skin',n:'はだいろ',c:'#fcd5b5'},{k:'black',n:'くろ',c:'#334155'},
  {k:'white',n:'しろ',c:'#ffffff'},{k:'rainbow',n:'にじいろ',c:'url(#rb)'}
];
const COLOR=Object.fromEntries(PALETTE.map(p=>[p.k,p]));
const WISH_COLORS=['red','pink','orange','yellow','lime','green','sky','blue','purple','rainbow'];

// ───────── シール ─────────
const STICKERS=[
  {k:'heart',n:'ハート'},{k:'star',n:'ほし'},{k:'sparkle',n:'きらきら'},
  {k:'flower',n:'おはな'},{k:'ribbon',n:'リボン'},{k:'blush',n:'ほっぺ'}
];
const STK=Object.fromEntries(STICKERS.map(s=>[s.k,s]));

// ───────── おきゃくさん（え）─────────
// 色をぬれる ところ＝class "p"＋data-part。目や口などの線＝class "d"（タップに反応しない）
const EY=(x,y,r=11)=>`<g class="d"><ellipse cx="${x}" cy="${y}" rx="${r*.82}" ry="${r*1.1}" fill="#3b2a24"/><circle cx="${x+r*.3}" cy="${y-r*.38}" r="${r*.32}" fill="#fff"/></g>`;
const SM=(x,y,w=18)=>`<path class="d" d="M${x-w} ${y} Q${x} ${y+w*.9} ${x+w} ${y}" fill="none" stroke="#5b4636" stroke-width="5" stroke-linecap="round"/>`;
const CH=(x1,x2,y,rx=17,ry=11)=>`<ellipse class="p soft" data-part="cheek" cx="${x1}" cy="${y}" rx="${rx}" ry="${ry}"/><ellipse class="p soft" data-part="cheek" cx="${x2}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
const POT=`<rect class="p" data-part="pot" x="108" y="304" width="184" height="26" rx="8"/><path class="p" data-part="pot" d="M122 330 L278 330 L260 396 L140 396 Z"/>`;
function ring(n,cx,cy,R,make){ let s=''; for(let i=0;i<n;i++){ const a=i*2*Math.PI/n; s+=make(cx+R*Math.cos(a),cy+R*Math.sin(a),a*180/Math.PI); } return s; }

const CUSTOMERS=[

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); if(id==='play') fitStage(); }
function fitStage(){ const w=$('stagewrap'); const s=Math.floor(Math.min(w.clientWidth,w.clientHeight)); if(s>0){ stage.style.width=s+'px'; stage.style.height=s+'px'; } }
addEventListener('resize',()=>{ if($('play').classList.contains('on')) fitStage(); });
// おねがいの ぎょうすうが かわると ステージの ひろさも かわるので、わくの おおきさを みはる
if(window.ResizeObserver) new ResizeObserver(()=>{ if($('play').classList.contains('on')) fitStage(); }).observe($('stagewrap'));

// ───────── おと・こえ ─────────
let ac=null;
function tone(f,d,type='sine',v=.12,t0=0){ if(saved.muted) return; try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime+t0, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02);
}catch(e){} }
const sChime=()=>{ tone(988,.35,'triangle',.12); tone(784,.5,'triangle',.12,.18); };
const sPop=()=>tone(660+Math.random()*200,.09,'sine',.1);
const sStk=()=>{ tone(1318,.12,'triangle',.08); tone(1760,.16,'triangle',.07,.07); };
const sFan=()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'triangle',.11,i*.11));
function speak(t){ if(saved.muted||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.85; u.pitch=1.15; speechSynthesis.speak(u); }catch(e){} }

// ───────── シールの え ─────────
function drawSticker(ctx,k,x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.lineJoin='round'; ctx.lineWidth=s*.07; ctx.strokeStyle='#fff';
  const fillStroke=()=>{ ctx.fill(); ctx.stroke(); };
  ctx.fillStyle=col;
  if(k==='heart'){ ctx.beginPath(); ctx.moveTo(0,s*.35); ctx.bezierCurveTo(-s*.6,-s*.05,-s*.35,-s*.55,0,-s*.2); ctx.bezierCurveTo(s*.35,-s*.55,s*.6,-s*.05,0,s*.35); fillStroke(); }
  else if(k==='star'){ ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?s*.2:s*.46, a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(r*Math.cos(a),r*Math.sin(a)); } ctx.closePath(); fillStroke(); }
  else if(k==='sparkle'){ const sp=(r)=>{ ctx.beginPath(); ctx.moveTo(0,-r); ctx.quadraticCurveTo(0,0,r,0); ctx.quadraticCurveTo(0,0,0,r); ctx.quadraticCurveTo(0,0,-r,0); ctx.quadraticCurveTo(0,0,0,-r); fillStroke(); };
    sp(s*.46); ctx.translate(s*.32,-s*.3); sp(s*.18); }
  else if(k==='flower'){ for(let i=0;i<5;i++){ const a=i*2*Math.PI/5; ctx.beginPath(); ctx.arc(Math.cos(a)*s*.22,Math.sin(a)*s*.22,s*.2,0,7); fillStroke(); }
    ctx.beginPath(); ctx.fillStyle='#facc15'; ctx.arc(0,0,s*.14,0,7); fillStroke(); }
  else if(k==='ribbon'){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-s*.46,-s*.28); ctx.lineTo(-s*.46,s*.28); ctx.closePath(); fillStroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*.46,-s*.28); ctx.lineTo(s*.46,s*.28); ctx.closePath(); fillStroke();
    ctx.beginPath(); ctx.arc(0,0,s*.12,0,7); fillStroke(); }
  else if(k==='blush'){ const g=ctx.createRadialGradient(0,0,0,0,0,s*.45); g.addColorStop(0,'rgba(244,114,182,.85)'); g.addColorStop(1,'rgba(244,114,182,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,s*.45,s*.3,0,0,7); ctx.fill(); }
  ctx.restore();
}

function flood(x,y,css){
  const d=px.getImageData(0,0,800,800), a=d.data, W=800, H=800, i0=(y*W+x)*4;
  const tmp=document.createElement('canvas').getContext('2d'); tmp.fillStyle=css; tmp.fillRect(0,0,1,1); const [r,g,b]=tmp.getImageData(0,0,1,1).data;
  const sr=a[i0],sg=a[i0+1],sb=a[i0+2]; if(Math.abs(sr-r)+Math.abs(sg-g)+Math.abs(sb-b)<10) return;
  const same=i=>Math.abs(a[i]-sr)+Math.abs(a[i+1]-sg)+Math.abs(a[i+2]-sb)<90;
  const seen=new Uint8Array(W*H), stack=[x,y];
  while(stack.length){ let cy=stack.pop(), cx=stack.pop(); let i=cy*W+cx;
    while(cx>0&&!seen[i-1]&&same((i-1)*4)){ cx--; i--; }
    let up=false, dn=false;
    for(;cx<W&&!seen[i]&&same(i*4);cx++,i++){ seen[i]=1; const k=i*4; a[k]=r; a[k+1]=g; a[k+2]=b; a[k+3]=255;
      if(cy>0){ const u=i-W; if(!seen[u]&&same(u*4)){ if(!up){ stack.push(cx,cy-1); up=true; } } else up=false; }
      if(cy<H-1){ const v=i+W; if(!seen[v]&&same(v*4)){ if(!dn){ stack.push(cx,cy+1); dn=true; } } else dn=false; } } }
  // ふちの すきまを 1ドット ひろげて なめらかに
  for(let yy=1;yy<H-1;yy++) for(let xx=1;xx<W-1;xx++){ const i=yy*W+xx; if(seen[i]) continue;
    if(seen[i-1]||seen[i+1]||seen[i-W]||seen[i+W]){ const k=i*4; if(a[k]+a[k+1]+a[k+2]>420){ a[k]=r;a[k+1]=g;a[k+2]=b;a[k+3]=255; } } }
  px.putImageData(d,0,0);
}

function burst(x,y,n){ if(reduce) return; for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:40,c:`hsl(${Math.random()*360|0} 90% 65%)`,s:4+Math.random()*5}); runFx(); }
function confetti(){ if(reduce) return; for(let i=0;i<90;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:160,c:`hsl(${Math.random()*360|0} 90% 62%)`,s:6+Math.random()*6}); runFx(); }
function runFx(){ if(fxOn) return; fxOn=true; const step=()=>{ const k=devicePixelRatio; fc.setTransform(k,0,0,k,0,0); fc.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0); parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.12; fc.fillStyle=p.c; fc.globalAlpha=Math.min(1,p.life/30); fc.beginPath(); fc.arc(p.x,p.y,p.s/2,0,7); fc.fill(); });
  fc.globalAlpha=1; if(parts.length) requestAnimationFrame(step); else { fxOn=false; fc.clearRect(0,0,innerWidth,innerHeight); } }; requestAnimationFrame(step); }

// ───────── タイトル ─────────
function titleScore(){ $('score').textContent=saved.served?`これまでの おきゃくさん ${saved.served}にん ／ ⭐ ${saved.stars}`:''; }
document.querySelectorAll('.age [data-age]').forEach(b=>{ b.setAttribute('aria-pressed',b.dataset.age===saved.age);
  b.addEventListener('click',()=>{ saved.age=b.dataset.age; save(); document.querySelectorAll('.age [data-age]').forEach(x=>x.setAttribute('aria-pressed',x===b)); sPop(); }); });
$('go-shop').addEventListener('click',()=>{ S.tool='fill'; nextCustomer(); });
$('go-draw').addEventListener('click',()=>{ buildPick(); show('drawpick'); });
$('go-album').addEventListener('click',openAlbum);
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{ if(window.speechSynthesis) speechSynthesis.cancel(); titleScore(); show('title'); }));
muteLabel(); titleScore(); setTool('fill'); refreshStickerIcons();
window.__salon={S,CUSTOMERS,setFill,renderBlob,DB,makeWishes,wishDone,nextCustomer,startDraw};
})();
